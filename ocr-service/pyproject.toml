[project]
name = "bs-agent-ocr-service"
version = "0.1.0"
description = "BsAgent PaddleOCR HTTP adapter"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anyio>=4.4.0",
  "fastapi>=0.111.0",
  "numpy>=1.26.0,<3.0.0",
  "paddleocr>=3.2.0,<4.0.0",
  "paddlepaddle>=3.1.0,<4.0.0",
  "pillow>=10.4.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ocr_service*"]
