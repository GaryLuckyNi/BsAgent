[project]
name = "bs-agent-service"
version = "0.1.0"
description = "Industrial Agentic RAG service"
requires-python = ">=3.11"
dependencies = [
  "ag-ui-protocol>=0.1.22,<0.2.0",
  "alembic>=1.13.2",
  "bm25s>=0.3.9,<0.4.0",
  "boto3>=1.40.46,<1.41.0",
  "celery[redis]>=5.6.0,<5.7.0",
  "fastapi>=0.111.0",
  "filetype>=1.2.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "langchain-openai>=1.2.2,<1.3.0",
  "limits[redis]>=5.8.0,<6.0.0",
  "mcp>=1.28.1",
  "opentelemetry-api>=1.30.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1.0.0",
  "opentelemetry-instrumentation-celery>=0.51b0,<1.0.0",
  "opentelemetry-instrumentation-httpx>=0.51b0,<1.0.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.51b0,<1.0.0",
  "opentelemetry-sdk>=1.30.0,<2.0.0",
  "pillow>=10.4.0",
  "psycopg[binary,pool]>=3.2.0",
  "python-json-logger>=3.2.0,<5.0.0",
  "pybreaker>=1.4.1,<1.5.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "PyJWT[crypto]>=2.9.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.0",
  "sse-starlette>=1.6.1,<3.0.0",
  "sqlalchemy>=2.0.31",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
exclude = ["app.tests*"]

[tool.setuptools.package-data]
app = ["intent/*.json"]

[tool.pytest.ini_options]
pythonpath = ["backend", "ocr-service"]
testpaths = ["backend/app/tests", "ocr-service/tests"]
markers = [
  "tool_search_eval: 运行工具检索质量与延迟评测",
]

[tool.ruff]
line-length = 100
target-version = "py311"
