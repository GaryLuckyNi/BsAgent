[project]
name = "bs-agent-mcp-server"
version = "0.1.0"
description = "Real MCP stdio server for BsAgent local integration tests"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28.1",
  "sse-starlette>=1.6.1,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
